name: Download & Upload to Internet Archive

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: "Media URL (M3U8 / HLS / MP4 / MKV ...)"
        required: true
        type: string
      identifier:
        description: "archive.org identifier (blank = auto-generated)"
        required: false
        type: string
        default: ""
      title:
        description: "Item title (blank = filename)"
        required: false
        type: string
        default: ""
      description:
        description: "Item description"
        required: false
        type: string
        default: "Uploaded via GitHub Actions"
      subject:
        description: "Tags (comma-separated)"
        required: false
        type: string
        default: "video"
      mediatype:
        description: "archive.org mediatype"
        required: false
        type: choice
        options: [movies, audio, texts, software, image, data]
        default: movies
      collection:
        description: "archive.org collection"
        required: false
        type: string
        default: "opensource_movies"
      no_derive:
        description: "Skip derivative processing (faster)"
        required: false
        type: boolean
        default: false
      user_agent:
        description: "Custom User-Agent for download (optional)"
        required: false
        type: string
        default: ""

jobs:
  download-then-upload:
    name: "⬇ Download on GitHub → ☁ Upload to archive.org"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. System deps ─────────────────────────────────────────────────────
      - name: 🔧 Install aria2c & ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 ffmpeg

      # ── 3. Python ──────────────────────────────────────────────────────────
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Python packages
        run: pip install --upgrade pip yt-dlp requests

      # ── 4. STEP 1: Download media onto the GitHub runner ───────────────────
      - name: ⚡ STEP 1 — Download media to GitHub runner
        env:
          MEDIA_URL: ${{ github.event.inputs.media_url }}
          USER_AGENT: ${{ github.event.inputs.user_agent }}
        run: |
          mkdir -p ./downloads

          echo "=========================================="
          echo "Downloading: $MEDIA_URL"
          echo "=========================================="

          UA_ARGS=()
          if [ -n "$USER_AGENT" ]; then
            UA_ARGS=(--user-agent "$USER_AGENT")
          fi

          # Try aria2c multi-thread first, fall back to native yt-dlp
          yt-dlp \
            --downloader aria2c \
            --downloader-args "aria2c:-x 16 -s 16 -k 1M --max-connection-per-server=16 --min-split-size=1M --optimize-concurrent-downloads=true --file-allocation=none" \
            --concurrent-fragments 16 \
            --hls-use-mpegts \
            --retries 10 \
            --fragment-retries 10 \
            --no-check-certificates \
            -o "./downloads/%(title)s.%(ext)s" \
            "${UA_ARGS[@]}" \
            "$MEDIA_URL" \
          || \
          yt-dlp \
            --concurrent-fragments 16 \
            --hls-use-mpegts \
            --retries 10 \
            --fragment-retries 10 \
            --no-check-certificates \
            -o "./downloads/%(title)s.%(ext)s" \
            "${UA_ARGS[@]}" \
            "$MEDIA_URL"

          echo ""
          echo "--- Downloaded files ---"
          ls -lh ./downloads/

      # ── 5. STEP 2: Upload the already-downloaded file to archive.org ───────
      - name: 📤 STEP 2 — Upload to archive.org
        env:
          IA_IDENTIFIER:  ${{ github.event.inputs.identifier }}
          IA_TITLE:       ${{ github.event.inputs.title }}
          IA_DESCRIPTION: ${{ github.event.inputs.description }}
          IA_SUBJECT:     ${{ github.event.inputs.subject }}
          IA_MEDIATYPE:   ${{ github.event.inputs.mediatype }}
          IA_COLLECTION:  ${{ github.event.inputs.collection }}
          IA_NO_DERIVE:   ${{ github.event.inputs.no_derive }}
        run: |
          # All inputs arrive as proper env vars — no word-splitting risk
          ARGS=(--outdir ./downloads --mediatype "$IA_MEDIATYPE" --collection "$IA_COLLECTION")

          [ -n "$IA_IDENTIFIER"  ] && ARGS+=(--identifier  "$IA_IDENTIFIER")
          [ -n "$IA_TITLE"       ] && ARGS+=(--title       "$IA_TITLE")
          [ -n "$IA_DESCRIPTION" ] && ARGS+=(--description "$IA_DESCRIPTION")
          [ -n "$IA_SUBJECT"     ] && ARGS+=(--subject     "$IA_SUBJECT")
          [ "$IA_NO_DERIVE" = "true" ] && ARGS+=(--no-derive)

          python upload_to_archive.py "${ARGS[@]}"

      # ── 6. Save artifact (1-day backup copy) ──────────────────────────────
      - name: 💾 Save artifact (1-day backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-media
          path: ./downloads/
          retention-days: 1
          if-no-files-found: warn
